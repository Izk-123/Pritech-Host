{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pritech Host</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/pritech_host_icon.png' %}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#1478C4', hover: '#0F5F9E', light: '#E6F1FB' },
                        navy: { DEFAULT: '#16365F', light: '#1E4A7E', text: '#BFE6FB' },
                        bg: '#F7FAFD',
                        text: '#0E2238',
                        muted: '#5B6B7C',
                        border: '#E1EAF2'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- FIXED: Framer Motion v10 (has UMD build) -->
    <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.16/dist/framer-motion.min.js"></script>
</head>
<body class="bg-bg text-text font-sans antialiased">
    <div id="root"></div>
    {% block react_code %}{% endblock %}
</body>
</html>
