{% extends 'base.html' %}
{% load static %}

{% block react_code %}

<!-- 1. Inject Django variables safely OUTSIDE the verbatim block -->
<script>
    window.PRITECH_LOGO_URL = "{% static 'images/pritech-logo.svg' %}";
    window.CSRF_TOKEN = "{{ csrf_token }}";
    window.FORM_ACTION = "{{ request.path }}";
    
    // We pass the connect URL for Google
    window.GOOGLE_CONNECT_URL = "{% provider_login_url 'google' process='connect' %}";

    // Pass the list of currently connected social accounts
    window.CONNECTED_ACCOUNTS = [
        {% for account in form.accounts %}
        {
            "id": "{{ account.id }}",
            "provider": "{{ account.get_provider.name }}",
            "uid": "{{ account.uid }}",
            "name": "{{ account.get_provider.name|title }}"
        }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ];
</script>

<!-- 2. React Code (Protected by verbatim) -->
{% verbatim %}
<script type="text/babel">
    const hasMotion = !!window.Motion;
    const motion = hasMotion ? window.Motion.motion : {
        div: (props) => <div {...props} />,
    };

    const LOGO_URL = window.PRITECH_LOGO_URL;
    const CSRF_TOKEN = window.CSRF_TOKEN;
    const FORM_ACTION = window.FORM_ACTION;
    const GOOGLE_CONNECT_URL = window.GOOGLE_CONNECT_URL;
    const CONNECTED_ACCOUNTS = window.CONNECTED_ACCOUNTS || [];

    function ConnectionsPage() {
        const isGoogleConnected = CONNECTED_ACCOUNTS.some(acc => acc.provider === 'Google');

        return (
            <div className="min-h-screen bg-bg flex flex-col font-sans text-text">
                <header className="bg-white border-b border-border px-4 py-4">
                    <div className="max-w-[1100px] mx-auto flex items-center justify-between">
                        <img src={LOGO_URL} alt="Pritech Host" className="h-[34px] object-contain" />
                        <a href="/" className="text-sm font-semibold text-navy hover:text-brand">Back to Home</a>
                    </div>
                </header>

                <main className="flex-grow flex items-center justify-center p-4">
                    <motion.div 
                        initial={hasMotion ? { opacity: 0, y: 20 } : {}} 
                        animate={hasMotion ? { opacity: 1, y: 0 } : {}}
                        className="bg-white border border-border rounded-[18px] p-8 w-full max-w-md flex flex-col gap-6 shadow-sm"
                    >
                        <div>
                            <h1 className="text-2xl font-heading font-bold text-navy mb-2">Account Connections</h1>
                            <p className="text-muted text-sm">
                                Manage your connected third-party accounts. Connecting allows you to log in with these services.
                            </p>
                        </div>

                        <div className="flex flex-col gap-4">
                            {/* Google Connection Card */}
                            <div className="border border-border rounded-xl p-4 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <svg className="w-6 h-6" viewBox="0 0 24 24">
                                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                    </svg>
                                    <span className="font-semibold text-navy">Google</span>
                                </div>
                                
                                {isGoogleConnected ? (
                                    <form method="POST" action={FORM_ACTION}>
                                        <input type="hidden" name="csrfmiddlewaretoken" value={CSRF_TOKEN} />
                                        <input type="hidden" name="account" value={CONNECTED_ACCOUNTS.find(a => a.provider === 'Google').id} />
                                        <button type="submit" name="action" value="disconnect" className="text-sm font-semibold text-red-600 hover:underline">
                                            Disconnect
                                        </button>
                                    </form>
                                ) : (
                                    <a href={GOOGLE_CONNECT_URL} className="text-sm font-semibold text-brand hover:underline">
                                        Connect
                                    </a>
                                )}
                            </div>
                        </div>
                    </motion.div>
                </main>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ConnectionsPage />);
</script>
{% endverbatim %}
{% endblock %}
