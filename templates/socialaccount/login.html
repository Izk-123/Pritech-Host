{% extends 'base.html' %}
{% load static %}

{% block react_code %}

<!-- 1. Inject Django variables safely OUTSIDE the verbatim block -->
<script>
    window.PRITECH_LOGO_URL = "{% static 'images/pritech-logo.svg' %}";
    window.CSRF_TOKEN = "{{ csrf_token }}";
    window.FORM_ACTION = "{{ request.path }}";
    window.PROVIDER_NAME = "{{ provider.name|default:'Google' }}";
</script>

<!-- 2. React Code (Protected by verbatim) -->
{% verbatim %}
<script type="text/babel">
    const hasMotion = !!window.Motion;
    const motion = hasMotion ? window.Motion.motion : {
        div: (props) => <div {...props} />,
    };

    const LOGO_URL = window.PRITECH_LOGO_URL;
    const CSRF_TOKEN = window.CSRF_TOKEN;
    const FORM_ACTION = window.FORM_ACTION;
    const PROVIDER_NAME = window.PROVIDER_NAME;

    function SocialLoginPage() {
        return (
            <div className="min-h-screen bg-bg flex flex-col font-sans text-text">
                <header className="bg-white border-b border-border px-4 py-4">
                    <div className="max-w-[1100px] mx-auto flex items-center">
                        <img src={LOGO_URL} alt="Pritech Host" className="h-[34px] object-contain" />
                    </div>
                </header>

                <main className="flex-grow flex items-center justify-center p-4">
                    <motion.div 
                        initial={hasMotion ? { opacity: 0, y: 20 } : {}} 
                        animate={hasMotion ? { opacity: 1, y: 0 } : {}}
                        className="bg-white border border-border rounded-[18px] p-8 w-full max-w-md flex flex-col gap-6 shadow-sm text-center"
                    >
                        <div className="w-16 h-16 bg-brand-light text-brand rounded-full flex items-center justify-center mx-auto mb-2">
                            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                            </svg>
                        </div>
                        
                        <div>
                            <h1 className="text-2xl font-heading font-bold text-navy mb-2">Sign In Via {PROVIDER_NAME}</h1>
                            <p className="text-muted text-sm">
                                You are about to sign in using a third-party account from <strong>{PROVIDER_NAME}</strong>.
                            </p>
                        </div>

                        <form method="POST" action={FORM_ACTION} className="flex flex-col gap-4 mt-2">
                            <input type="hidden" name="csrfmiddlewaretoken" value={CSRF_TOKEN} />
                            
                            <button type="submit" className="w-full bg-brand text-white font-semibold py-3 rounded-xl hover:bg-brand-hover transition-colors">
                                Continue with {PROVIDER_NAME}
                            </button>
                        </form>

                        <div className="mt-2">
                            <a href="/accounts/login/" className="text-sm text-muted hover:text-navy font-medium">
                                Cancel
                            </a>
                        </div>
                    </motion.div>
                </main>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SocialLoginPage />);
</script>
{% endverbatim %}
{% endblock %}
