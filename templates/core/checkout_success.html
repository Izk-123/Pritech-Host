{% extends 'base.html' %}
{% block react_code %}
<div class="min-h-screen bg-bg flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-border text-center max-w-md w-full">
        <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-navy mb-2">Order Received!</h1>
        <p class="text-muted mb-6">
            Invoice {{ invoice.invoice_number }} has been generated. Please check your email for payment instructions via Airtel Money, TNM Mpamba, or Card.
        </p>
        <a href="{% url 'core:home' %}" class="bg-brand text-white px-6 py-3 rounded-xl font-semibold hover:bg-brand-hover inline-block">
            Back to Home
        </a>
    </div>
</div>
{% endblock %}
