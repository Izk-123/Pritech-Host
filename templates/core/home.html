{% extends 'base.html' %}
{% load static %}

{% block react_code %}
<script>
    window.PRITECH_LOGO_URL = "{% static 'images/pritech-logo.svg' %}";
    window.URLS = {
        login:     "{% url 'account_login' %}",
        logout:    "{% url 'account_logout' %}",
        dashboard: "{% url 'core:dashboard' %}",
        signup:    "{% url 'account_signup' %}"
    };
    window.IS_AUTHENTICATED = {% if request.user.is_authenticated %}true{% else %}false{% endif %};

    window.SITE = {
        name:              "{{ site.site_name|escapejs }}",
        email:             "{{ site.contact_email|escapejs }}",
        phone:             "{{ site.contact_phone|escapejs }}",
        address:           "{{ site.physical_address|escapejs }}",
        heroBadge:         "{{ site.hero_badge|escapejs }}",
        heroHeadline:      "{{ site.hero_headline|escapejs }}",
        heroSubheadline:   "{{ site.hero_subheadline|escapejs }}",
        footerTagline:     "{{ site.footer_tagline|escapejs }}"
    };
</script>

<script id="plans-data" type="application/json">
    [
        {% for plan in plans %}
        {
            "id": "{{ plan.id }}",
            "name": "{{ plan.name }}",
            "price": "{{ plan.price_mwk|floatformat:'0' }}",
            "billing_period": "{% if plan.billing_period == 'monthly' %}month{% else %}year{% endif %}",
            "isPopular": {% if forloop.counter == 2 %}true{% else %}false{% endif %},
            "features": [
                "{{ plan.disk_space_gb }}GB SSD storage",
                "{{ plan.email_accounts }} professional email accounts",
                "Free SSL certificate",
                "{% if plan.backup_frequency == 'daily' %}Daily backups{% elif plan.backup_frequency == 'weekly' %}Weekly backups{% else %}No automatic backups{% endif %}"
            ]
        }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ]
</script>

{{ site.preview_features|json_script:"preview-features" }}

{% verbatim %}
<script type="text/babel">
    const { useState } = React;

    const hasMotion = !!window.Motion;
    const motion = hasMotion ? window.Motion.motion : { div: (props) => <div {...props} /> };
    const AnimatePresence = hasMotion ? window.Motion.AnimatePresence : ({ children }) => <>{children}</>;

    const plansData       = JSON.parse(document.getElementById('plans-data').textContent);
    const previewFeatures = JSON.parse(document.getElementById('preview-features').textContent);

    const LOGO_URL        = window.PRITECH_LOGO_URL;
    const URLS            = window.URLS;
    const IS_AUTHENTICATED = window.IS_AUTHENTICATED;
    const SITE            = window.SITE || {};

    const fadeUp = hasMotion ? { hidden: { opacity: 0, y: 20 }, visible: { opacity: 1, y: 0, transition: { duration: 0.5 } } } : {};
    const staggerContainer = hasMotion ? { hidden: { opacity: 0 }, visible: { opacity: 1, transition: { staggerChildren: 0.1 } } } : {};

    const Modal = ({ isOpen, onClose, title, children }) => {
        if (!isOpen) return null;
        return (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-navy/50 backdrop-blur-sm">
                <motion.div initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} className="bg-white rounded-[18px] p-6 w-full max-w-md shadow-xl">
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-xl font-heading font-bold text-navy">{title}</h2>
                        <button onClick={onClose} className="text-muted hover:text-red-500">✕</button>
                    </div>
                    {children}
                </motion.div>
            </div>
        );
    };

    function App() {
        const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
        const [isContactOpen, setIsContactOpen] = useState(false);

        return (
            <div className="overflow-hidden min-h-screen flex flex-col relative">
                <header className="bg-white border-b border-border px-4 py-3 sticky top-0 z-50">
                    <div className="max-w-[1200px] mx-auto flex items-center justify-between gap-6 relative">
                        <a href="/"><img src={LOGO_URL} alt={SITE.name} className="h-[34px] md:h-[44px] object-contain" /></a>

                        <nav className="hidden md:flex items-center gap-6 ml-auto text-[15px] font-medium text-navy">
                            <a href="#plans" className="hover:text-brand">Plans</a>
                            <button onClick={() => setIsContactOpen(true)} className="hover:text-brand">Support</button>
                            {IS_AUTHENTICATED ? (
                                <>
                                    <a href={URLS.dashboard} className="border border-border px-5 py-2.5 rounded-xl hover:bg-gray-50">Dashboard</a>
                                    <a href={URLS.logout} className="bg-brand text-white px-5 py-2.5 rounded-xl hover:bg-brand-hover">Sign out</a>
                                </>
                            ) : (
                                <>
                                    <a href={URLS.login} className="border border-border px-5 py-2.5 rounded-xl hover:bg-gray-50">Sign in</a>
                                    <a href="#plans" className="bg-brand text-white px-5 py-2.5 rounded-xl hover:bg-brand-hover">Get started</a>
                                </>
                            )}
                        </nav>

                        <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="md:hidden w-10 h-10 flex items-center justify-center bg-white rounded-lg ml-auto z-50 relative">
                            <svg className="w-6 h-6 text-navy" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                {isMobileMenuOpen
                                    ? <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                                    : <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7h16M4 12h16M4 17h16" />}
                            </svg>
                        </button>

                        <AnimatePresence>
                            {isMobileMenuOpen && (
                                <motion.div initial={{ opacity: 0, y: -20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -20 }} className="absolute top-[100%] left-0 w-full bg-white border-b border-border shadow-lg md:hidden flex flex-col px-4 py-4 gap-2 z-40">
                                    <a href="#plans" onClick={() => setIsMobileMenuOpen(false)} className="font-medium text-navy py-2">Plans</a>
                                    <button onClick={() => { setIsMobileMenuOpen(false); setIsContactOpen(true); }} className="font-medium text-navy py-2 text-left">Support</button>
                                    <div className="h-px w-full bg-border my-2"></div>
                                    {IS_AUTHENTICATED ? (
                                        <>
                                            <a href={URLS.dashboard} className="text-center border border-border text-navy font-semibold py-2.5 rounded-xl mt-1">Dashboard</a>
                                            <a href={URLS.logout} className="text-center bg-brand text-white font-semibold py-2.5 rounded-xl mt-1">Sign out</a>
                                        </>
                                    ) : (
                                        <>
                                            <a href={URLS.login} className="text-center border border-border text-navy font-semibold py-2.5 rounded-xl mt-1">Sign in</a>
                                            <a href="#plans" onClick={() => setIsMobileMenuOpen(false)} className="text-center bg-brand text-white font-semibold py-2.5 rounded-xl mt-1">Get started</a>
                                        </>
                                    )}
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </div>
                </header>

                <section className="px-4 md:px-6 py-8 md:py-[72px] max-w-[1200px] mx-auto w-full flex flex-col md:flex-row gap-8 md:gap-[48px] items-center">
                    <motion.div className="flex-1 flex flex-col gap-4 md:gap-5 w-full" initial="hidden" animate="visible" variants={staggerContainer}>
                        <motion.span variants={fadeUp} className="bg-brand-light text-brand text-xs md:text-sm font-semibold px-3 py-1.5 rounded-full self-start">{SITE.heroBadge}</motion.span>
                        <motion.h1 variants={fadeUp} className="text-[32px] md:text-[52px] leading-[1.15] md:leading-[1.1] font-heading font-bold text-navy">{SITE.heroHeadline}</motion.h1>
                        <motion.p variants={fadeUp} className="text-muted text-base md:text-lg max-w-[520px]">{SITE.heroSubheadline}</motion.p>
                        <motion.div variants={fadeUp} className="flex flex-col md:flex-row gap-3 mt-2">
                            <a href="#plans" className="w-full md:w-auto bg-brand text-white text-center font-semibold py-3 md:py-3.5 px-6 rounded-xl hover:bg-brand-hover transition-colors">Choose a package</a>
                            <button onClick={() => setIsContactOpen(true)} className="w-full md:w-auto bg-white text-navy border border-border text-center font-semibold py-3 md:py-3.5 px-6 rounded-xl hover:bg-gray-50 transition-colors">Talk to us</button>
                        </motion.div>
                    </motion.div>

                    <motion.div className="flex-1 w-full max-w-[480px] bg-navy rounded-[18px] p-4 md:p-6 flex flex-col gap-2.5 md:gap-3.5 shadow-lg" initial={{ opacity: 0, x: 20 }} animate={{ opacity: 1, x: 0 }} transition={{ duration: 0.6, delay: 0.2 }}>
                        {previewFeatures.map((item, i) => (
                            <div key={i} className="flex items-center bg-navy-light rounded-xl p-3.5 md:p-4">
                                <span className="w-2.5 h-2.5 rounded-full bg-[#4FC3F7] mr-3"></span>
                                <span className="text-white font-semibold text-sm md:text-[15px]">{item.label}</span>
                                <span className="ml-auto text-navy-text text-xs md:text-[13px] font-medium">{item.value}</span>
                            </div>
                        ))}
                    </motion.div>
                </section>

                <section id="plans" className="py-8 md:py-10 flex flex-col gap-6 md:gap-7 max-w-[1200px] mx-auto w-full">
                    <div className="px-4 md:px-6">
                        <h2 className="text-2xl md:text-[34px] font-heading font-bold text-navy">Choose your package</h2>
                        <p className="text-muted text-sm md:text-base mt-1.5 md:mt-2">Billed yearly. Work starts after a 25% deposit.</p>
                    </div>
                    <div className="flex overflow-x-auto gap-3 md:gap-5 pb-4 px-4 md:px-6 snap-x snap-mandatory md:grid md:grid-cols-3 md:overflow-visible md:pb-0 scrollbar-hide">
                        {plansData.map((plan) => (
                            <motion.div key={plan.id} className={`flex-none w-[78%] md:w-auto snap-center bg-white rounded-[18px] p-6 border ${plan.isPopular ? 'border-brand border-2 relative' : 'border-border'} flex flex-col`} whileHover={{ y: -5 }}>
                                {plan.isPopular && <span className="absolute -top-3 left-6 bg-brand-light text-brand text-xs font-bold px-3 py-1 rounded-full">Most popular</span>}
                                <h3 className="text-xl md:text-[22px] font-heading font-bold text-navy">{plan.name}</h3>
                                <div className="mt-2 mb-4"><span className="text-3xl font-heading font-bold text-navy">MWK {Number(plan.price).toLocaleString()}</span><span className="text-muted text-sm"> / {plan.billing_period}</span></div>
                                <ul className="flex flex-col gap-2.5 mb-6 flex-grow">
                                    {plan.features.map((feature, i) => (
                                        <li key={i} className="flex items-center text-sm text-text">
                                            <span className="w-2 h-2 rounded-full bg-brand mr-2.5"></span>{feature}
                                        </li>
                                    ))}
                                </ul>
                                <a href={`/checkout/${plan.id}/`} className={`block w-full text-center font-semibold py-3 rounded-xl transition-colors ${plan.isPopular ? 'bg-brand text-white hover:bg-brand-hover' : 'bg-white text-navy border border-border hover:bg-gray-50'}`}>Order {plan.name}</a>
                            </motion.div>
                        ))}
                    </div>
                </section>

                {/* ---------------- Footer ---------------- */}
                <footer className="bg-navy text-navy-text px-4 py-6 mt-auto">
                    <div className="max-w-[1200px] mx-auto flex flex-col gap-3">
                        {/* Contact row */}
                        <div className="flex flex-col md:flex-row gap-2 items-center">
                            <span className="text-white font-heading font-bold text-lg">{SITE.name}</span>
                            {SITE.footerTagline && (
                                <span className="text-xs text-navy-text md:ml-4">{SITE.footerTagline}</span>
                            )}
                            <div className="md:ml-auto flex gap-4 text-sm">
                                <a href={`mailto:${SITE.email}`} className="hover:text-white">{SITE.email}</a>
                                <a href={`tel:${SITE.phone}`} className="hover:text-white">{SITE.phone}</a>
                            </div>
                        </div>

                        {/* Legal row */}
                        <div className="flex flex-wrap gap-4 text-xs pt-3 border-t border-navy-light">
                            <a href="/legal/terms/"   className="hover:text-white">Terms of Service</a>
                            <a href="/legal/privacy/" className="hover:text-white">Privacy Policy</a>
                            <a href="/legal/aup/"     className="hover:text-white">Acceptable Use</a>
                            <a href="/legal/refund/"  className="hover:text-white">Refund Policy</a>
                        </div>
                    </div>
                </footer>

                <Modal isOpen={isContactOpen} onClose={() => setIsContactOpen(false)} title={`Contact ${SITE.name}`}>
                    <p className="text-sm text-muted mb-4">Send us an email or give us a call — we'll get back to you shortly.</p>
                    <a href={`mailto:${SITE.email}`} className="block text-center bg-brand text-white font-semibold py-3 rounded-xl mb-2 hover:bg-brand-hover">
                        Email {SITE.email}
                    </a>
                    <a href={`tel:${SITE.phone}`} className="block text-center border border-border py-3 rounded-xl mb-2 hover:bg-gray-50">
                        Call {SITE.phone}
                    </a>
                    <button onClick={() => setIsContactOpen(false)} className="w-full border border-border py-3 rounded-xl hover:bg-gray-50">Close</button>
                </Modal>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
{% endverbatim %}
{% endblock %}
