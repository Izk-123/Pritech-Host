{% extends 'base.html' %}
{% load static %}
{% load socialaccount %}

{% block react_code %}

<script>
    window.PRITECH_LOGO_URL = "{% static 'images/pritech-logo.svg' %}";
    window.CSRF_TOKEN = "{{ csrf_token }}";
    window.SIGNUP_URL = "{% url 'account_signup' %}";
    window.LOGIN_URL = "{% url 'account_login' %}";

    {# GUARD: only run provider_login_url when Google is fully configured. #}
    {# google_sso_enabled comes from core.context_processors.social_providers. #}
    {% if google_sso_enabled %}
        window.GOOGLE_LOGIN_URL = "{% provider_login_url 'google' %}";
    {% else %}
        window.GOOGLE_LOGIN_URL = "";
    {% endif %}

    window.FORM_ERRORS = {{ form.errors.as_json|safe|default:"{}" }};
</script>

{% verbatim %}
<script type="text/babel">
    const hasMotion = !!window.Motion;
    const motion = hasMotion ? window.Motion.motion : {
        div: (props) => <div {...props} />,
    };

    const LOGO_URL         = window.PRITECH_LOGO_URL;
    const CSRF_TOKEN       = window.CSRF_TOKEN;
    const SIGNUP_URL       = window.SIGNUP_URL;
    const LOGIN_URL        = window.LOGIN_URL;
    const GOOGLE_LOGIN_URL = window.GOOGLE_LOGIN_URL || '';
    const formErrors       = window.FORM_ERRORS || {};

    function SignupPage() {
        const getError = (field) => {
            return formErrors[field] ? formErrors[field][0].message : null;
        };

        const emailError     = getError('email');
        const password1Error = getError('password1');
        const password2Error = getError('password2');
        const generalError   = getError('__all__');

        // Hide the Google button entirely when it's not configured.
        // Same reasoning as checkout.html — the divider only makes sense
        // when the button is above it.
        const showGoogleButton = !!GOOGLE_LOGIN_URL;

        return (
            <div className="min-h-screen bg-bg flex flex-col font-sans text-text">
                <header className="bg-white border-b border-border px-4 py-4">
                    <div className="max-w-[1100px] mx-auto flex items-center">
                        <a href="/">
                            <img src={LOGO_URL} alt="Pritech Host" className="h-[34px] object-contain" />
                        </a>
                    </div>
                </header>

                <main className="flex-grow flex items-center justify-center p-4 py-12">
                    <motion.div
                        initial={hasMotion ? { opacity: 0, y: 20 } : {}}
                        animate={hasMotion ? { opacity: 1, y: 0 } : {}}
                        className="bg-white border border-border rounded-[18px] p-8 w-full max-w-md flex flex-col gap-6 shadow-sm"
                    >
                        <div className="text-center">
                            <h1 className="text-2xl font-heading font-bold text-navy mb-2">Create an account</h1>
                            <p className="text-muted text-sm">Get started with Pritech Host today.</p>
                        </div>

                        {generalError && (
                            <div className="bg-red-50 text-red-700 border border-red-200 p-4 rounded-xl text-sm font-medium">
                                {generalError}
                            </div>
                        )}

                        {showGoogleButton && (
                            <>
                                <a href={GOOGLE_LOGIN_URL} className="w-full border border-border rounded-xl py-3 font-semibold text-navy hover:bg-gray-50 flex items-center justify-center gap-2">
                                    <svg className="w-5 h-5" viewBox="0 0 24 24">
                                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                    </svg>
                                    Sign up with Google
                                </a>

                                <div className="flex items-center gap-4 text-muted text-xs">
                                    <div className="flex-1 h-px bg-border"></div>
                                    <span>or sign up with email</span>
                                    <div className="flex-1 h-px bg-border"></div>
                                </div>
                            </>
                        )}

                        <form method="POST" action={SIGNUP_URL} className="flex flex-col gap-4">
                            <input type="hidden" name="csrfmiddlewaretoken" value={CSRF_TOKEN} />

                            <div className="flex flex-col gap-1.5">
                                <label className="text-sm font-semibold text-navy">Email address</label>
                                <input
                                    type="email" name="email" required
                                    className={`border rounded-lg p-3 focus:outline-none ${emailError ? 'border-red-500 bg-red-50' : 'border-border focus:border-brand'}`}
                                    placeholder="john@example.com"
                                />
                                {emailError && <span className="text-xs text-red-600 font-medium">{emailError}</span>}
                            </div>

                            <div className="flex flex-col gap-1.5">
                                <label className="text-sm font-semibold text-navy">Password</label>
                                <input
                                    type="password" name="password1" required
                                    className={`border rounded-lg p-3 focus:outline-none ${password1Error ? 'border-red-500 bg-red-50' : 'border-border focus:border-brand'}`}
                                    placeholder="••••••••"
                                />
                                {password1Error && <span className="text-xs text-red-600 font-medium">{password1Error}</span>}
                            </div>

                            <div className="flex flex-col gap-1.5">
                                <label className="text-sm font-semibold text-navy">Confirm Password</label>
                                <input
                                    type="password" name="password2" required
                                    className={`border rounded-lg p-3 focus:outline-none ${password2Error ? 'border-red-500 bg-red-50' : 'border-border focus:border-brand'}`}
                                    placeholder="••••••••"
                                />
                                {password2Error && <span className="text-xs text-red-600 font-medium">{password2Error}</span>}
                            </div>

                            {/* Legal acceptance — required before submission */}
                            <label className="flex items-start gap-3 text-sm text-muted">
                                <input type="checkbox" name="accept_terms" required className="mt-1" />
                                <span>
                                    I accept the{' '}
                                    <a href="/legal/terms/" target="_blank" rel="noopener" className="text-brand underline hover:no-underline">Terms of Service</a>,{' '}
                                    <a href="/legal/privacy/" target="_blank" rel="noopener" className="text-brand underline hover:no-underline">Privacy Policy</a>, and{' '}
                                    <a href="/legal/aup/" target="_blank" rel="noopener" className="text-brand underline hover:no-underline">Acceptable Use Policy</a>.
                                </span>
                            </label>

                            <button type="submit" className="w-full bg-brand text-white font-semibold py-3 rounded-xl hover:bg-brand-hover transition-colors mt-2">
                                Create Account
                            </button>
                        </form>

                        <p className="text-center text-sm text-muted">
                            Already have an account? <a href={LOGIN_URL} className="text-brand font-semibold hover:underline">Sign in</a>
                        </p>
                    </motion.div>
                </main>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SignupPage />);
</script>
{% endverbatim %}
{% endblock %}
